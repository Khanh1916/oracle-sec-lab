# =============================================================
# Build the OracleSecLab web image and publish it to GHCR:
#   ghcr.io/khanh1916/oracle-sec-lab-web
#
# - push to master  -> :latest + :sha-<short>
# - tag v1.2.3      -> :1.2.3 + :1.2 + :sha-<short>
# - pull request    -> build only (no push), to validate the Dockerfile
# - manual          -> "Run workflow" button (workflow_dispatch)
#
# The Oracle database image is NOT built here; it comes from
# gvenzl/oracle-free upstream.
# =============================================================
name: Publish Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/khanh1916/oracle-sec-lab-web   # GHCR names must be lowercase

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=oracle-sec-lab-web
            org.opencontainers.image.description=OracleSecLab vulnerable web portal (PHP 8.1 + Apache + OCI8). Educational use in isolated labs only.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
