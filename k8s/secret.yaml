# Lab credentials. These are intentionally the well-known lab defaults,
# NOT real secrets — this is a deliberately vulnerable training app.
# stringData keeps them human-readable; Kubernetes stores them base64.
apiVersion: v1
kind: Secret
metadata:
  name: dbs401-secret
  labels:
    app.kubernetes.io/part-of: oracle-sec-lab
type: Opaque
stringData:
  ORACLE_PASSWORD: "oracle"          # SYS / SYSTEM password (oracle container)
  APP_USER_PASSWORD: "dbs401_pass"   # app schema password (oracle container)
  DB_PASS: "dbs401_pass"             # app schema password (web container)
