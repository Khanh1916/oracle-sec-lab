# Partner update server (Challenge 3 - Supply Chain).
# Serves the baseline manifest on port 8081 inside the web container,
# so admin.php's default update_url (http://127.0.0.1:8081/manifest.json)
# resolves exactly as it does on the VM / Nginx setup.
<VirtualHost *:8081>
    DocumentRoot /var/www/partner-api
    DirectoryIndex manifest.json
    <Directory /var/www/partner-api>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Content-Type "application/json"
    </Directory>
</VirtualHost>
