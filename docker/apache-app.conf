# OracleSecLab application alias - mirrors the VM setup.sh config
# so the portal lives at the same path: /dbs401-oracle-app
Alias /dbs401-oracle-app /var/www/html/dbs401-oracle-app
<Directory /var/www/html/dbs401-oracle-app>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>
